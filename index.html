<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ثانوية نهج البلاغة للبنين — سجل القيود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F2A20;
    --ink-2:#173B2C;
    --cream:#F6F3E9;
    --cream-2:#EDE8D6;
    --brass:#B98F2E;
    --brass-deep:#93701E;
    --line:#DCD4B8;
    --text-soft:#5B6B5F;
    --red:#A23B32;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    padding-bottom:100px;
  }

  .hero{
    background:linear-gradient(160deg, var(--ink) 0%, var(--ink-2) 100%);
    padding:36px 20px 30px;
    text-align:center;
    position:relative;
  }
  .hero h1{
    font-family:'Reem Kufi', sans-serif;
    font-weight:700;
    font-size:clamp(26px, 6vw, 34px);
    color:var(--cream);
    margin:0 0 6px;
    line-height:1.3;
  }
  .hero .tagline{
    font-size:14px;
    color:var(--brass);
    letter-spacing:.3px;
    margin:0 0 16px;
  }
  .hero .rule{
    width:64px; height:3px;
    background:var(--brass);
    margin:0 auto 16px;
    border-radius:2px;
  }
  .hero .count-row{
    display:flex; justify-content:center; align-items:center; gap:16px;
    font-size:13px; color:#D9D2B8;
  }
  .hero .count-row b{ color:var(--cream); font-size:15px; }
  .hero .sync-link{
    color:var(--brass);
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  .search-wrap{
    max-width:640px;
    margin:-22px auto 0;
    padding:0 16px;
    position:relative;
    z-index:5;
  }
  .search-box{
    display:flex;
    align-items:center;
    background:#FFFFFF;
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    box-shadow:0 8px 24px rgba(15,42,32,0.12);
  }
  .search-box svg{flex:0 0 auto; opacity:.5;}
  .search-box input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Tajawal', sans-serif;
    font-size:16px;
    color:var(--ink);
    padding:0 10px;
    direction:rtl;
  }
  .search-box input::placeholder{color:#A79E7E;}

  .results-meta{
    max-width:640px;
    margin:14px auto 0;
    padding:0 20px;
    font-size:13px;
    color:var(--text-soft);
  }

  .results{
    max-width:640px;
    margin:8px auto 0;
    padding:0 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .empty-state{
    max-width:640px;
    margin:56px auto;
    padding:0 30px;
    text-align:center;
    color:var(--text-soft);
  }
  .empty-state .glyph{font-size:30px; margin-bottom:10px; opacity:.55;}
  .empty-state p{margin:4px 0; font-size:14px; line-height:1.9;}

  .card{
    background:#FFFFFF;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    transition:box-shadow .15s ease;
  }
  .card.open{box-shadow:inset 0 0 0 1.5px var(--brass);}
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .card-name{
    font-size:16.5px;
    font-weight:700;
    color:var(--ink);
    line-height:1.5;
  }
  .card-badges{display:flex; gap:6px; flex:0 0 auto;}
  .badge{
    font-size:12px;
    font-weight:700;
    border-radius:7px;
    padding:4px 9px;
    white-space:nowrap;
    border:1px solid rgba(185,143,46,0.35);
    background:rgba(185,143,46,0.09);
    color:var(--brass-deep);
  }
  .badge.page{
    border-color:rgba(15,42,32,0.18);
    background:rgba(15,42,32,0.05);
    color:var(--ink-2);
  }

  .card-actions{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    display:none;
    gap:8px;
  }
  .card.open .card-actions{display:flex;}

  .btn-mini{
    flex:1;
    text-align:center;
    padding:9px 10px;
    border-radius:9px;
    font-size:13px;
    font-weight:700;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    font-family:'Tajawal', sans-serif;
  }
  .btn-mini.edit{color:var(--brass-deep); border-color:rgba(185,143,46,0.4);}
  .btn-mini.del{color:var(--red); border-color:rgba(162,59,50,0.35);}

  .fab{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:var(--cream);
    border:none;
    border-radius:999px;
    padding:14px 26px;
    font-family:'Tajawal', sans-serif;
    font-size:15px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow:0 8px 22px rgba(15,42,32,0.35);
    cursor:pointer;
    z-index:40;
  }
  .fab:active{transform:translateX(-50%) scale(.97);}

  .sheet-overlay{
    position:fixed; inset:0;
    background:rgba(15,42,32,0.5);
    display:none;
    z-index:50;
    align-items:flex-end;
    justify-content:center;
  }
  .sheet-overlay.show{display:flex;}
  .sheet{
    background:var(--cream);
    width:100%;
    max-width:640px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:18px 18px 0 0;
    padding:18px 20px 24px;
    border-top:3px solid var(--brass);
    animation:slideUp .22s ease;
  }
  @keyframes slideUp{from{transform:translateY(24px);opacity:0;} to{transform:translateY(0);opacity:1;}}
  .sheet-handle{
    width:40px;height:4px;background:var(--line);
    border-radius:2px; margin:0 auto 14px;
  }
  .sheet h2{
    font-family:'Reem Kufi', sans-serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 16px;
    color:var(--ink);
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--text-soft);
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-family:'Tajawal', sans-serif;
    font-size:15px;
    background:#FFFFFF;
    color:var(--ink);
    direction:rtl;
  }
  .field input:focus{outline:none; border-color:var(--brass);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .sheet-actions{display:flex; gap:10px; margin-top:18px;}
  .btn{
    flex:1;
    padding:13px;
    border-radius:10px;
    font-family:'Tajawal', sans-serif;
    font-size:15px;
    font-weight:700;
    border:none;
    cursor:pointer;
  }
  .btn.primary{background:var(--ink); color:var(--cream);}
  .btn.secondary{background:transparent; color:var(--text-soft); border:1.5px solid var(--line);}

  .toast{
    position:fixed;
    bottom:96px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink);
    color:var(--cream);
    padding:10px 18px;
    border-radius:9px;
    font-size:13.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:60;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .loading{
    text-align:center;
    padding:60px 20px;
    color:var(--text-soft);
    font-size:14px;
  }
</style>
</head>

<div class="hero">
  <h1>ثانوية نهج البلاغة للبنين</h1>
  <div class="tagline">سجل القيود</div>
  <div class="rule"></div>
  <div class="count-row">
    <span>عدد القيود: <b id="totalCount">—</b></span>

  </div>
</div>

<div class="search-wrap">

  </div>
  <div id="reviewBtn" style="display:none; margin-top:10px; background:#FFF7E6; border:1px solid rgba(185,143,46,0.45); border-radius:10px; padding:10px 14px; font-size:13.5px; color:var(--brass-deep); font-weight:700; cursor:pointer; text-align:center;">

</div>

<div class="results-meta" id="resultsMeta"></div>
<div class="results" id="results"></div>

<button class="fab" id="addBtn">

  إضافة قيد جديد
</button>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">

    </div>
    <div class="field-row">
      <div class="field">
        <label>رقم القيد</label>
        <input type="text" id="f_qaid" placeholder="رقم القيد" inputmode="numeric">
      </div>
      <div class="field">
        <label>رقم الصفحة</label>
        <input type="text" id="f_page" placeholder="رقم الصفحة" inputmode="numeric">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn secondary" id="cancelBtn">إلغاء</button>
      <button class="btn primary" id="saveBtn">حفظ القيد</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

let students = null;
let editingId = null;

function normalizeAr(s){
  return (s||'').toString()
    .replace(/[\u064B-\u0652]/g,'')
    .replace(/[إأآا]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/ؤ/g,'و')
    .replace(/ئ/g,'ي')
    .trim();
}

function loadFromCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveToCache(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(students)); }catch(e){}
}

async function seedFirestoreIfNeeded(){
  const metaRef = doc(db, META_COL, 'status');
  const metaSnap = await getDoc(metaRef);
  if(metaSnap.exists() && metaSnap.data().seeded) return false;

  const BATCH_SIZE = 450;
  for(let i=0;i<SEED_DATA.length;i+=BATCH_SIZE){
    const batch = writeBatch(db);
    const slice = SEED_DATA.slice(i, i+BATCH_SIZE);
    slice.forEach(rec => {
      const { id, ...data } = rec;
      batch.set(doc(db, STUDENTS_COL, String(id)), data);
    });
    await batch.commit();
    document.getElementById('results').innerHTML =
      `<div class="loading">جارِ استيراد البيانات الأولية… (${Math.min(i+BATCH_SIZE, SEED_DATA.length)} / ${SEED_DATA.length})<br>هذا يحدث مرة واحدة فقط</div>`;
  }
  await setDoc(metaRef, { seeded: true });
  return true;
}

async function fetchAllFromFirestore(){
  const snap = await getDocs(collection(db, STUDENTS_COL));
  const arr = [];
  snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
  return arr;
}

async function loadStudents(){
  const cached = loadFromCache();
  if(cached && cached.length){
    students = cached;
    document.getElementById('totalCount').textContent = students.length.toLocaleString('ar');
    renderEmpty();
    return;
  }

  document.getElementById('results').innerHTML = '<div class="loading">جارِ الاتصال بقاعدة البيانات…</div>';
  try{
    const justSeeded = await seedFirestoreIfNeeded();
    students = justSeeded
      ? SEED_DATA.map(({ id, ...rest }) => ({ id: String(id), ...rest }))
      : await fetchAllFromFirestore();
    saveToCache();
  }catch(e){
    students = SEED_DATA.map(({ id, ...rest }) => ({ id: String(id), ...rest }));
    showToast('تعذر الاتصال بقاعدة البيانات، يعمل الموقع بنسخة محلية مؤقتة');
  }
  document.getElementById('totalCount').textContent = students.length.toLocaleString('ar');
  updateReviewBadge();
  renderEmpty();
}

async function refreshFromServer(){
  showToast('جارِ التحديث من القاعدة…');
  try{
    students = await fetchAllFromFirestore();
    saveToCache();
    updateReviewBadge();
    showToast('تم التحديث');
    renderResults(document.getElementById('searchInput').value);
  }catch(e){
    showToast('تعذر التحديث، تحقق من الاتصال');
  }
}
window.refreshFromServer = refreshFromServer;

function updateReviewBadge(){
  const flagged = students.filter(s => s.review);
  const btn = document.getElementById('reviewBtn');
  if(flagged.length > 0){
    btn.style.display = 'block';
    document.getElementById('reviewCount').textContent = flagged.length.toLocaleString('ar');
  } else {
    btn.style.display = 'none';
  }
}

function attachCardListeners(box){
  box.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => {
      if(e.target.closest('.btn-mini')) return;
      card.classList.toggle('open');
    });
  });
  box.querySelectorAll('.btn-mini.edit').forEach(btn => {
    btn.addEventListener('click', () => openSheet(btn.dataset.id));
  });
  box.querySelectorAll('.btn-mini.del').forEach(btn => {
    btn.addEventListener('click', () => deleteStudent(btn.dataset.id));
  });
}

function renderReviewResults(){
  const meta = document.getElementById('resultsMeta');
  const box = document.getElementById('results');
  const flagged = students.filter(s => s.review);
  document.getElementById('searchInput').value = '';
  if(flagged.length === 0){
    meta.textContent = '';
    box.innerHTML = `
      <div class="empty-state">
        <div class="glyph">✓</div>
        <p>لا توجد سجلات تحتاج مراجعة حالياً.</p>
      </div>`;
    return;
  }
  meta.textContent = flagged.length + ' سجل يحتاج مراجعة — رقم القيد أو الصفحة كان غير واضح في الملف الأصلي';
  box.innerHTML = flagged.map(s => cardHtml(s)).join('');
  attachCardListeners(box);
}
document.getElementById('reviewBtn').addEventListener('click', renderReviewResults);

function escapeHtml(str){
  return (str||'').toString()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderEmpty(){
  document.getElementById('resultsMeta').textContent = '';
  const box = document.getElementById('results');
  box.innerHTML = `
    <div class="empty-state">
      <div class="glyph">📖</div>
      <p>اكتب اسم الطالب في خانة البحث لعرض قيده وصفحته.</p>
      <p>يمكنك أيضاً إضافة قيد جديد من الزر أدناه.</p>
    </div>`;
}

function renderResults(query){
  const meta = document.getElementById('resultsMeta');
  const box = document.getElementById('results');

  if(!query || query.trim().length < 3){
    if(query && query.trim().length > 0){
      meta.textContent = '';
      box.innerHTML = `
        <div class="empty-state">
          <div class="glyph">…</div>
          <p>أدخل 3 أحرف على الأقل من اسم الطالب لعرض النتائج.</p>
        </div>`;
    } else {
      renderEmpty();
    }
    return;
  }

  const nq = normalizeAr(query);
  const matches = students.filter(s => normalizeAr(s.name).includes(nq));

  if(matches.length === 0){
    meta.textContent = 'لا توجد نتائج';
    box.innerHTML = `
      <div class="empty-state">
        <div class="glyph">✕</div>
        <p>لم يُعثر على أي طالب بهذا الاسم.</p>
        <p>تحقق من الإملاء أو أضف قيداً جديداً بهذا الاسم.</p>
      </div>`;
    return;
  }

  meta.textContent = matches.length > 50
    ? (matches.length + ' نتيجة — تُعرض أول 50، دقّق البحث أكثر لتضييق النتائج')
    : (matches.length + ' نتيجة');
  box.innerHTML = matches.slice(0, 50).map(s => cardHtml(s)).join('');
  attachCardListeners(box);
}

function cardHtml(s){
  return `
    <div class="card" data-id="${s.id}">
      <div class="card-top">
        <div class="card-name">${escapeHtml(s.name)}</div>
        <div class="card-badges">
          ${s.review ? `<span class="badge" style="background:#FDECC8;border-color:#E8C877;color:#8A6415;">تحتاج مراجعة</span>` : ''}
          ${s.qaid ? `<span class="badge">قيد ${escapeHtml(s.qaid)}</span>` : ''}
          ${s.page ? `<span class="badge page">ص ${escapeHtml(s.page)}</span>` : ''}
        </div>
      </div>
      <div class="card-actions">
        <button class="btn-mini edit" data-id="${s.id}">تعديل</button>
        <button class="btn-mini del" data-id="${s.id}">حذف</button>
      </div>
    </div>
  `;
}

function openSheet(id){
  editingId = id || null;
  const sheet = document.getElementById('sheetOverlay');
  const title = document.getElementById('sheetTitle');
  if(id){
    const s = students.find(x => x.id === id);
    title.textContent = 'تعديل القيد';
    document.getElementById('f_name').value = s.name || '';
    document.getElementById('f_qaid').value = s.qaid || '';
    document.getElementById('f_page').value = s.page || '';
  } else {
    title.textContent = 'إضافة قيد جديد';
    ['f_name','f_qaid','f_page'].forEach(id2 => document.getElementById(id2).value = '');
  }
  sheet.classList.add('show');
}

function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('show');
  editingId = null;
}

async function saveStudent(){
  const name = document.getElementById('f_name').value.trim();
  if(!name){
    showToast('الرجاء إدخال اسم الطالب');
    return;
  }
  const data = {
    name,
    qaid: document.getElementById('f_qaid').value.trim(),
    page: document.getElementById('f_page').value.trim(),
    review: false,
  };

  try{
    if(editingId){
      const idx = students.findIndex(x => x.id === editingId);
      if(idx > -1) students[idx] = { id: editingId, ...data };
      await updateDoc(doc(db, STUDENTS_COL, editingId), data);
      showToast('تم تحديث القيد');
    } else {
      const ref = await addDoc(collection(db, STUDENTS_COL), data);
      students.push({ id: ref.id, ...data });
      document.getElementById('totalCount').textContent = students.length.toLocaleString('ar');
      showToast('تمت إضافة القيد الجديد');
    }
    saveToCache();
    updateReviewBadge();
  }catch(e){
    showToast('تعذر حفظ التعديل، تحقق من الاتصال وحاول مجدداً');
    return;
  }

  closeSheet();
  const q = document.getElementById('searchInput').value;
  if(q && q.trim().length > 0){
    renderResults(q);
  } else {
    document.getElementById('searchInput').value = name;
    renderResults(name);
  }
}

async function deleteStudent(id){
  if(!confirm('هل تريد حذف هذا القيد نهائياً؟')) return;
  try{
    await deleteDoc(doc(db, STUDENTS_COL, id));
    students = students.filter(x => x.id !== id);
    saveToCache();
    document.getElementById('totalCount').textContent = students.length.toLocaleString('ar');
    updateReviewBadge();
    showToast('تم حذف القيد');
  }catch(e){
    showToast('تعذر حذف القيد، حاول مجدداً');
  }
  renderResults(document.getElementById('searchInput').value);
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

let debounceTimer;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(debounceTimer);
  const val = e.target.value;
  debounceTimer = setTimeout(() => renderResults(val), 120);
});

document.getElementById('addBtn').addEventListener('click', () => openSheet(null));
document.getElementById('cancelBtn').addEventListener('click', closeSheet);
document.getElementById('saveBtn').addEventListener('click', saveStudent);
document.getElementById('sheetOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'sheetOverlay') closeSheet();
});

document.getElementById('results').innerHTML = '<div class="loading">جارِ تحميل السجل…</div>';
loadStudents();
</script>
